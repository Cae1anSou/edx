name: frontend assets check

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

jobs:
  frontend_assets_check:
    name: studio-dashboard-build-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [20]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm
        run: |
          npm clean-install
          npm --prefix frontend-app-studio-dashboard ci

      - name: Build Frontend (development mode)
        run: |
          npm run build-dev

      - name: Build Frontend (production mode)
        run: |
          npm run build

      - name: Build E2E TypeScript
        run: |
          npm --prefix frontend-app-studio-dashboard run e2e:build
