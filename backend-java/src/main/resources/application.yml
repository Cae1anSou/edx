spring:
  application:
    name: backend-java
  flyway:
    enabled: false
  datasource:
    # Local default datasource for development/tests.
    url: jdbc:h2:mem:backend_java;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  shutdown: graceful

app:
  identity:
    repository: inmemory
  enrollment:
    repository: inmemory
  learning-progress:
    repository: inmemory
  notification:
    repository: inmemory
