spring:
  application:
    name: backend-java
  flyway:
    enabled: false
  datasource:
    # Local default datasource for development/tests.
    url: jdbc:h2:mem:backend_java;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  shutdown: graceful

app:
  course:
    repository: inmemory
  coursex:
    repository: inmemory
  enterprise:
    repository: inmemory
  consent:
    repository: inmemory
  taxonomy:
    repository: inmemory
  identity:
    repository: inmemory
  enrollment:
    repository: inmemory
  learning-progress:
    repository: inmemory
  grading:
    repository: inmemory
  certificate:
    repository: inmemory
  job-orchestrator:
    repository: inmemory
    scheduler:
      enabled: true
      fixed-delay-ms: 5000
  notification:
    repository: inmemory
  zendesk:
    url: ""
    oauth-token: ""
  agreements:
    enable-integrity-signature: true
    enable-lti-pii-acknowledgement: true
  bookmarks:
    max-per-course: 100
  lang-pref:
    default-language: en
